# Internal TestFlight — iOS, tvOS, macOS of the one multiplatform target.
#
# Secrets, first-time Apple setup, and how to trigger a run: docs/testflight.md.
# Missing secrets skip this workflow with a notice; they do not fail the run.
#
# Archives run on `xcode-27`. This project is Xcode 27's `project.xcproj`;
# Xcode 26 cannot open it, and Fastlane's xcodeproj gem / gym look for
# `project.pbxproj` which does not exist here.

name: TestFlight

on:
  schedule:
    # Best-effort. This repo is a fork of leoru/kinopub-apple-client, and the
    # last commits to this file were from a GitHub App (`cursoragent`). After
    # that, GitHub never queued `schedule` runs (Oct 12 06:00, Oct 13 06:23).
    # Off minute 0 so a human-authored cron is less likely to be dropped.
    - cron: "23 6 * * *"
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to upload
        required: true
        default: all
        type: choice
        options:
          - all
          - ios
          - tvos
          - macos
      changelog:
        description: What to Test (whats-new.json for this version if empty)
        required: false
        type: string

permissions:
  contents: read
  actions: read

# One archive at a time. Do not cancel an in-progress upload if a
# later push or workflow_dispatch arrives while cron is still archiving.
# Push is the reliable daily trigger (see schedule comment); the gate
# allows at most one successful automatic archive per UTC day.
concurrency:
  group: testflight
  cancel-in-progress: false

env:
  FASTLANE_HIDE_CHANGELOG: "1"
  FASTLANE_OPT_OUT_USAGE: "1"

jobs:
  gate:
    name: Should we upload?
    runs-on: ubuntu-latest
    outputs:
      should_upload: ${{ steps.decide.outputs.should_upload }}
      matrix: ${{ steps.decide.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Decide
        id: decide
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TESTFLIGHT_PLATFORM: ${{ github.event_name == 'workflow_dispatch' && inputs.platform || 'all' }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          MAC_INSTALLER_CERTIFICATE_BASE64: ${{ secrets.MAC_INSTALLER_CERTIFICATE_BASE64 }}
          MAC_INSTALLER_CERTIFICATE_PASSWORD: ${{ secrets.MAC_INSTALLER_CERTIFICATE_PASSWORD }}
        run: .github/scripts/testflight-gate.sh

  prepare:
    name: Reserve build number
    needs: gate
    if: needs.gate.outputs.should_upload == 'true'
    runs-on: ubuntu-latest
    outputs:
      build_number: ${{ steps.reserve.outputs.build_number }}
      matrix: ${{ needs.gate.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler: "4.0.19"
          bundler-cache: true

      - name: Reserve the next shared build number
        id: reserve
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
        run: BUILD_NUMBERS_FILE="$GITHUB_OUTPUT" bundle exec fastlane ios reserve_build_number

  upload:
    name: Upload ${{ matrix.platform }}
    needs: [gate, prepare]
    if: needs.gate.outputs.should_upload == 'true'
    runs-on: xcode-27
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.gate.outputs.matrix) }}
    env:
      APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
      BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
      P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
      MAC_INSTALLER_CERTIFICATE_BASE64: ${{ secrets.MAC_INSTALLER_CERTIFICATE_BASE64 }}
      MAC_INSTALLER_CERTIFICATE_PASSWORD: ${{ secrets.MAC_INSTALLER_CERTIFICATE_PASSWORD }}
      TESTFLIGHT_INTERNAL_GROUPS: ${{ vars.TESTFLIGHT_INTERNAL_GROUPS }}
      TESTFLIGHT_CHANGELOG: ${{ inputs.changelog }}
      TESTFLIGHT_PLATFORM: ${{ matrix.platform }}
      BUILD_NUMBER: ${{ needs.prepare.outputs.build_number }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select Xcode 27
        run: .github/scripts/select-xcode-27.sh

      - name: Toolchain versions
        run: |
          xcodebuild -version
          swift --version

      - name: Xcode can open the project
        run: xcodebuild -list -project KinoPubAppleClient.xcodeproj

      - name: Ensure Metal toolchain
        run: xcodebuild -downloadComponent MetalToolchain || echo "bundled with this Xcode"

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler: "4.0.19"
          bundler-cache: true

      - name: Lint Fastlane (no extra secrets)
        run: bundle exec fastlane ios lint

      - name: Build and upload to TestFlight
        run: bundle exec fastlane ios beta
